<!DOCTYPE html>
<html lang="en">
  <head>
    <meta name="robots" content="noindex">
    <meta name="googlebot" content="noindex">

    <meta charset="utf-8">
    <meta name="application-name" content="{{ siteHostname }}">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="Description" content="My personal photo library">
    <link rel="canonical" href="{{ siteUrl }}/">

    <!-- Preconnects -->
    <link rel="preconnect" href="{{{ cdnUrl }}}">

    <!-- Preloads -->
    <link rel="preload" href="/dist/js/app.{{ buildId }}.js" as="script" crossorigin>
    <link rel="preload" href="/manifest/tribbles.{{ publicationId }}.txt" as="fetch" crossorigin>
    <link rel="preload" href="/fonts/GolosText-Regular.woff2" as="font" type="font/woff2" crossorigin>
    {{#prefetched}}
    <link rel="preload" fetchpriority="high" href="{{{.}}}" as="image">
    {{/prefetched}}

    <link rel="alternate" type="application/atom+xml" title="Atom Feed" href="/manifest/atom/atom-index.xml" />

    <!-- OpenGraph Attributes -->
    <meta property="og:title" content="{{ siteHostname }}">
    <meta property="og:description" content="My personal photo library">
    <meta property="og:type" content="website">
    <meta property="og:locale" content="en_IE">
    <meta property="og:url" content="{{ siteUrl }}">
    <meta property="og:site_name" content="{{ siteHostname }}">

    <link rel="manifest" href="/site.webmanifest">
    <link rel="shortcut icon" type="image/png" href="/icons/favicon-32x32.png"/ defer="" fetchpriorty="low">

    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#0056b3">

    <link rel="stylesheet" href="/dist/css/style.{{ buildId }}.css" as="style">
    <link
      rel="preload"
      href="/vendor/leaflet@1.9.4/leaflet.css"
      as="style"
      onload="this.onload=null;this.rel='stylesheet'"
    >
    <noscript>
      <link rel="stylesheet" href="/vendor/leaflet@1.9.4/leaflet.css">
    </noscript>

    <script>
      // reduce blocking requests by injecting critical data into the page

      window.envConfig = {{{ env }}}
      window.homepageThumbnails = {{{ homepageThumbnails }}}.map(url => `${url}.webp`)
      window.stats = {{{ stats }}}
      window.flagSprite = "{{{ flagSprite }}}"

    </script>
    <script type="importmap">
      {
        "imports": {
          "leaflet": "/vendor/leaflet@1.9.4/leaflet-src.esm.min.js"
        }
      }
    </script>
    <script type="module" src="/dist/js/app.{{ buildId }}.js"></script>

    <title>{{ siteHostname }}</title>
  </head>

  <body></body>

  <script async fetchpriority="low">
    // -- register a service-worker
    if('serviceWorker' in navigator) {
      console.log('⚙️ loading service worker: /sw.js')

      navigator.serviceWorker.register('/sw.js').catch(err => {
        console.error(`⚙️ failed service worker: /sw.js ${err}`)
      });

      navigator.serviceWorker.ready.then(registration => {
        if (window.homepageThumbnails) {
          console.log('sending homepage thumbnails to service worker')
          registration.active?.postMessage({
            type: 'homepageThumbnails',
            thumbnails: window.homepageThumbnails
          });
        } else {
          console.log('window not updated')
        }
      }).catch(err => {
        console.error(`⚙️ failed to send homepage thumbnails to service worker: ${err}`)
      });
    } else {
      console.error('⚙️ service worker not supported: /sw.{{ buildId }}.js')
    }
  </script>
</html>
