name: Integration Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: websites/photos.rgrannell.xyz

    steps:
      - uses: actions/checkout@v5
        with:
          path: websites/photos.rgrannell.xyz

      - uses: actions/checkout@v5
        with:
          repository: rgrannell1/tribbledb
          path: tribbledb

      - uses: actions/checkout@v5
        with:
          repository: rgrannell1/peach.ts
          path: peach.ts

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: websites/photos.rgrannell.xyz/package-lock.json

      - uses: denoland/setup-deno@v2
        with:
          deno-version: 2.6.1
          cache: true

      - run: timeout 120 npm ci

      - run: timeout 300 npx playwright install --with-deps chromium

      - run: timeout 120 ./bs/lint.sh

      - run: timeout 240 ./bs/test.sh

      - name: Check built assets
        run: >-
          timeout 30 git diff --exit-code --
          dist index.html sw.js manifest/tribbles.*.txt

      - name: Upload browser diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-diagnostics
          path: |
            websites/photos.rgrannell.xyz/playwright-report
            websites/photos.rgrannell.xyz/test-results
          if-no-files-found: ignore
